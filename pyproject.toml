[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pycausalarima"
version = "0.1.0"
description = "Causal effect estimation using ARIMA models for time series interventions"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    {name = "Robson Tigre"},
]
maintainers = [
    {name = "Robson Tigre"},
]
keywords = [
    "causal inference",
    "time series",
    "ARIMA",
    "intervention analysis",
    "policy evaluation",
    "counterfactual",
    "econometrics"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21.0,<3.0.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "statsmodels>=0.14.0",
    "pmdarima>=2.1.1",
    "matplotlib>=3.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "pyreadr>=0.5.0",
]
docs = [
    "sphinx>=6.0.0",
    "sphinx-rtd-theme>=1.3.0",
    "numpydoc>=1.5.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pyreadr>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/RobsonTigre/pycausalarima"
Repository = "https://github.com/RobsonTigre/pycausalarima"
Issues = "https://github.com/RobsonTigre/pycausalarima/issues"
"Original R Package" = "https://github.com/FMenchetti/CausalArima"

[tool.setuptools.packages.find]
where = ["."]
include = ["pycausalarima*"]

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["pycausalarima"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
strict_optional = true

[tool.setuptools.package-data]
pycausalarima = ["py.typed"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "UP"]
ignore = ["D100", "D104"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=pycausalarima --cov-report=term-missing"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "dgp_main: Main DGP suite (DGPs 1-8)",
    "dgp_sarima: SARIMA DGP suite (DGPs 9-18)",
    "dgp_extended: Extended DGP suite (DGPs 19-30)",
    "cross_validation: All cross-validation tests against R",
]
